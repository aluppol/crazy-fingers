<section class="guide" [class.guide--rejected]="rejected()">
  <div class="keyboard" aria-hidden="true" [style.--row-units]="keyUnitsPerRow">
    <div class="keyboard__caption">
      <span>Next key</span>
      <span class="keyboard__badge">{{ badge() }}</span>
    </div>
    @for (row of rows(); track $index) {
      <div class="keyboard__row">
        @for (cap of row; track cap.code) {
          <span class="keyboard__slot" [style.--key-width]="cap.width">
            <span
              class="key key--{{ cap.finger }} key--{{ cap.role }}"
              [class.key--next]="isNextKey(cap)"
              [class.key--held]="isHeldShift(cap)"
            >
              @if (cap.shiftedLabel !== null) {
                <span class="key__shifted">{{ cap.shiftedLabel }}</span>
              }
              <span class="key__label">{{ cap.label }}</span>
            </span>
          </span>
        }
      </div>
    }
  </div>
  <svg class="hands" viewBox="0 0 240 110" aria-hidden="true">
    <g>
      <rect class="hands__palm" x="10" y="58" width="74" height="48" rx="20" />
      <rect class="hands__finger hands__finger--pinky" [class.hands__finger--lit]="isLit(fingers.LeftPinky)" x="10" y="34" width="15" height="38" rx="7.5" />
      <rect class="hands__finger hands__finger--ring" [class.hands__finger--lit]="isLit(fingers.LeftRing)" x="29" y="18" width="15" height="54" rx="7.5" />
      <rect class="hands__finger hands__finger--middle" [class.hands__finger--lit]="isLit(fingers.LeftMiddle)" x="48" y="10" width="15" height="62" rx="7.5" />
      <rect class="hands__finger hands__finger--index" [class.hands__finger--lit]="isLit(fingers.LeftIndex)" x="67" y="20" width="15" height="52" rx="7.5" />
      <rect class="hands__finger hands__finger--thumb" [class.hands__finger--lit]="isLit(fingers.Thumb)" x="86" y="58" width="15" height="36" rx="7.5" transform="rotate(-38 93 62)" />
    </g>
    <g transform="translate(240 0) scale(-1 1)">
      <rect class="hands__palm" x="10" y="58" width="74" height="48" rx="20" />
      <rect class="hands__finger hands__finger--pinky" [class.hands__finger--lit]="isLit(fingers.RightPinky)" x="10" y="34" width="15" height="38" rx="7.5" />
      <rect class="hands__finger hands__finger--ring" [class.hands__finger--lit]="isLit(fingers.RightRing)" x="29" y="18" width="15" height="54" rx="7.5" />
      <rect class="hands__finger hands__finger--middle" [class.hands__finger--lit]="isLit(fingers.RightMiddle)" x="48" y="10" width="15" height="62" rx="7.5" />
      <rect class="hands__finger hands__finger--index" [class.hands__finger--lit]="isLit(fingers.RightIndex)" x="67" y="20" width="15" height="52" rx="7.5" />
      <rect class="hands__finger hands__finger--thumb" [class.hands__finger--lit]="isLit(fingers.Thumb)" x="86" y="58" width="15" height="36" rx="7.5" transform="rotate(-38 93 62)" />
    </g>
  </svg>
  <p class="visually-hidden" aria-live="polite">{{ announcement() }}</p>
  @if (layoutMismatch()) {
    <p class="guide__notice">{{ switchNotice() }}</p>
  }
</section>
