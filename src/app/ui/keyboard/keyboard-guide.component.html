<section class="guide" [class.guide--rejected]="rejected()">
  <div class="keyboard" aria-hidden="true" [style.--row-units]="keyUnitsPerRow">
    <div class="keyboard__caption">
      <span>Next key</span>
      <span class="keyboard__badge">{{ badge() }}</span>
    </div>
    @for (row of rows(); track $index) {
      <div class="keyboard__row">
        @for (cap of row; track cap.code) {
          <span class="keyboard__slot" [style.--key-width]="cap.width">
            <span
              class="key key--{{ cap.finger }} key--{{ cap.role }}"
              [class.key--next]="isNextKey(cap)"
              [class.key--held]="isHeldShift(cap)"
              [class.key--home]="isHomeAnchor(cap)"
            >
              @if (cap.shiftedLabel !== null) {
                <span class="key__shifted">{{ cap.shiftedLabel }}</span>
              }
              <span class="key__label">{{ cap.label }}</span>
            </span>
          </span>
        }
      </div>
    }
  </div>
  <svg class="hands" viewBox="0 0 280 156" aria-hidden="true">
    <g transform="translate(6 2)">
      <path
        class="hands__palm"
        d="M 12 108 C 10 95 19 90 30 90 L 86 90 C 99 90 108 97 108 111 L 104 134 C 103 143 95 146 86 146 L 32 146 C 21 146 15 142 14 134 Z"
      />
      <rect class="hands__finger hands__finger--pinky" [class.hands__finger--lit]="isLit(fingers.LeftPinky)" x="14" y="52" width="17" height="56" rx="8.5" />
      <rect class="hands__finger hands__finger--ring" [class.hands__finger--lit]="isLit(fingers.LeftRing)" x="37" y="26" width="17" height="82" rx="8.5" />
      <rect class="hands__finger hands__finger--middle" [class.hands__finger--lit]="isLit(fingers.LeftMiddle)" x="60" y="18" width="17" height="90" rx="8.5" />
      <rect class="hands__finger hands__finger--index" [class.hands__finger--lit]="isLit(fingers.LeftIndex)" x="83" y="32" width="17" height="76" rx="8.5" />
      <rect
        class="hands__finger hands__finger--thumb"
        [class.hands__finger--lit]="isLit(fingers.Thumb)"
        x="95" y="98" width="18" height="46" rx="9" transform="rotate(41 104 104)"
      />
    </g>
    <g transform="translate(274 2) scale(-1 1)">
      <path
        class="hands__palm"
        d="M 12 108 C 10 95 19 90 30 90 L 86 90 C 99 90 108 97 108 111 L 104 134 C 103 143 95 146 86 146 L 32 146 C 21 146 15 142 14 134 Z"
      />
      <rect class="hands__finger hands__finger--pinky" [class.hands__finger--lit]="isLit(fingers.RightPinky)" x="14" y="52" width="17" height="56" rx="8.5" />
      <rect class="hands__finger hands__finger--ring" [class.hands__finger--lit]="isLit(fingers.RightRing)" x="37" y="26" width="17" height="82" rx="8.5" />
      <rect class="hands__finger hands__finger--middle" [class.hands__finger--lit]="isLit(fingers.RightMiddle)" x="60" y="18" width="17" height="90" rx="8.5" />
      <rect class="hands__finger hands__finger--index" [class.hands__finger--lit]="isLit(fingers.RightIndex)" x="83" y="32" width="17" height="76" rx="8.5" />
      <rect
        class="hands__finger hands__finger--thumb"
        [class.hands__finger--lit]="isLit(fingers.Thumb)"
        x="95" y="98" width="18" height="46" rx="9" transform="rotate(41 104 104)"
      />
    </g>
  </svg>
  <p class="visually-hidden" aria-live="polite">{{ announcement() }}</p>
  @if (layoutMismatch()) {
    <p class="guide__notice">{{ switchNotice() }}</p>
  }
</section>
